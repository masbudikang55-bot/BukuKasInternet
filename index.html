<style>
#bk{color-scheme:light;position:fixed;inset:0;z-index:2147483000;background:#fff;font-family:Inter,system-ui,sans-serif;color:#1e293b;overflow:hidden}
#bk *{box-sizing:border-box}

aside .nv.act{background:#2563eb;color:#fff}

<body>
<div id="bk">

<!-- LOGIN (bersih) -->
<div id="login" class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 via-white to-sky-100">
  <form onsubmit="doLogin(event)" class="glass rounded-3xl shadow-2xl p-8 w-full max-w-sm space-y-4">
    <div class="text-center">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-emerald-500 text-white flex items-center justify-center text-2xl shadow-lg mb-2"><i class="fa-solid fa-wifi"></i></div>
      <h1 id="brand-login" class="text-xl font-extrabold">BUKU KAS</h1>
      <p class="text-[11px] font-semibold text-blue-600 uppercase tracking-wider">Aplikasi Tagihan Internet</p>
    </div>
    <div><label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Email Admin / Username Petugas</label><input id="lu" required autocomplete="username" class="w-full py-2.5 px-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
    <div><label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Password</label><input id="lp" type="password" required autocomplete="current-password" class="w-full py-2.5 px-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
    <div id="le" class="hidden p-2.5 rounded-xl bg-red-50 text-red-600 text-xs text-center border border-red-200">Login gagal. Periksa kembali akun Anda.</div>
    <button class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg active:scale-95 transition">Masuk</button>
  </form>
</div>

<!-- APLIKASI -->
<div id="app" class="hidden h-full bg-slate-50">
  <aside class="hidden md:flex fixed inset-y-0 left-0 w-60 flex-col justify-between bg-white text-slate-800 border-r border-slate-200 p-4 z-30">
    <div>
      <div class="flex items-center gap-3 mb-6 px-1"><div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-emerald-500 flex items-center justify-center"><i class="fa-solid fa-wifi"></i></div><span id="brand" class="font-extrabold">BUKU KAS</span></div>
      <nav id="nav-side" class="space-y-1"></nav>
    </div>
    <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs"><div id="u-nama" class="font-bold truncate"></div><div id="u-info" class="text-slate-500 truncate"></div></div>
  </aside>
  <div class="md:ml-60 h-full flex flex-col">
    <header class="glass flex items-center justify-between px-4 py-3 border-b z-20">
      <div><h1 id="ttl" class="font-extrabold text-base"></h1><p id="sub" class="text-[11px] text-slate-500"></p></div>
      <div class="flex gap-2">
        <button onclick="refresh()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold"><i id="ri" class="fa-solid fa-arrows-rotate text-blue-600"></i><span class="hidden sm:inline ml-1.5">Refresh</span></button>
        <button onclick="logout()" class="px-3 py-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold"><i class="fa-solid fa-right-from-bracket"></i><span class="hidden sm:inline ml-1.5">Keluar</span></button>
      </div>
    </header>
    <main id="main" class="flex-1 overflow-y-auto p-4 pb-28 md:pb-6"></main>
  </div>
  <nav id="nav-bot" class="md:hidden fixed bottom-3 inset-x-3 glass rounded-2xl shadow-xl flex p-1 z-30"></nav>
</div>

<div id="modal"></div>
<div id="print-area"></div>
<div id="toast" class="fixed bottom-24 md:bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl text-white text-xs font-semibold shadow-xl transition-all opacity-0 pointer-events-none z-[60]"></div>
</div>

<script>
// KONFIGURASI APLIKASI
const IS_PREVIEW = false; // Set false JIKA SUDAH TERHUBUNG KE FIREBASE
// PASTE FIREBASE CONFIG ANDA DI SINI
const firebaseConfig = {
  apiKey: "AIzaSyCTeb9H_rpCYRjuYPVybA3S39QmmkILbx0",
  authDomain: "buku-kas-v1-profesional.firebaseapp.com",
  projectId: "buku-kas-v1-profesional",
  storageBucket: "buku-kas-v1-profesional.firebasestorage.app",
  messagingSenderId: "131944543436",
  appId: "1:131944543436:web:e3e8fd9f3fcf18a5d93e69"
};

/* ===== PWA: service worker via Blob ===== */
(function(){try{if('serviceWorker' in navigator){const js="self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',()=>{});";navigator.serviceWorker.register(URL.createObjectURL(new Blob([js],{type:'text/javascript'}))).catch(()=>{})}}catch(e){}})();

/* ===== Helper ===== */
const $=i=>document.getElementById(i);
const IN='w-full py-2 px-3 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500';
const BT='px-3 py-2 rounded-xl text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 active:scale-95 transition';
const S={cabang:[],users:[],pelanggan:[],tagihan:[],settings:[]};
let me=null,tab='dashboard',F={cab:'',bln:mk(new Date()),q:''},FB=null,charts=[],CH={};
function mk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
const bl=k=>{const[y,m]=k.split('-');return new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})};
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sha=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'plain:'+s}};
const isA=()=>me&&me.role==='Admin';
const cabNama=id=>(S.cabang.find(c=>c.id===id)||{}).nama||'-';
const brand=()=>(S.settings.find(s=>s.id==='app')||{}).namaAplikasi||'BUKU KAS';
const who=()=>({uid:me.uid,nama:me.nama,role:me.role,cabangId:me.cabangId||''});
const canSee=x=>isA()||(x.diinputOleh&&x.diinputOleh.uid===me.uid);
const visP=()=>S.pelanggan.filter(canSee).filter(p=>!F.cab||p.cabangId===F.cab);
const visT=()=>S.tagihan.filter(canSee).filter(t=>!F.cab||t.cabangId===F.cab);
const uid6=()=>Date.now().toString(36).toUpperCase().slice(-6);
function toast(m,t){const e=$('toast');e.textContent=m;e.style.background=t==='e'?'#dc2626':'#0f172a';e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2600)}
async function safe(fn){try{await fn();return true}catch(e){toast('Gagal: '+(e.code||e.message),'e');return false}}
const fld=(l,i)=>`<div><label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">${l}</label>${i}</div>`;
let PG=1;const PER=10;
function table(h,rows,all){
  const tot=rows.length,pages=Math.max(1,Math.ceil(tot/PER));if(PG>pages)PG=pages;
  const v=all?rows:rows.slice((PG-1)*PER,PG*PER),nums=[];
  for(let i=Math.max(1,PG-2);i<=Math.min(pages,PG+2);i++)nums.push(`<button onclick="PG=${i};pgr()" class="px-3 py-1.5 rounded-lg border font-bold ${i===PG?'bg-blue-600 text-white border-blue-600':'bg-white border-slate-200 text-slate-600'}">${i}</button>`);
  const bt='px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 font-bold disabled:opacity-40';
  const pager=all||tot<=PER?'':`<div class="flex flex-wrap items-center justify-between gap-2 p-3 border-t border-slate-100 text-xs text-slate-500"><span>Hal ${PG} / ${pages} &bull; ${tot} data</span><div class="flex gap-1"><button ${PG<=1?'disabled':''} onclick="pg(-1)" class="${bt}">&laquo;</button>${nums.join('')}<button ${PG>=pages?'disabled':''} onclick="pg(1)" class="${bt}">&raquo;</button></div></div>`;
  return `<table class="w-full text-xs"><thead class="bg-slate-50 text-slate-500 uppercase text-[10px]"><tr>${h.map(x=>`<th class="p-3 text-left whitespace-nowrap">${x}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-100">${v.length?v.map(r=>`<tr class="hover:bg-blue-50/40">${r.map(c=>`<td class="p-3 align-middle">${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="p-8 text-center text-slate-400">Belum ada data</td></tr>`}</tbody></table>`+pager}
const pgr=()=>({pelanggan:tPlg,bayar:tByr,laporan:tLap,cabang:tCab,user:tUsr})[tab]();
const pg=d=>{PG+=d;pgr()};
function modal(t,h){$('modal').innerHTML=`<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" onclick="if(event.target===this)closeModal()"><div class="bg-white rounded-2xl p-5 w-full max-w-md max-h-full overflow-y-auto shadow-2xl"><div class="flex justify-between items-center mb-3"><h3 class="font-extrabold">${t}</h3><button onclick="closeModal()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark"></i></button></div>${h}</div></div>`}
const closeModal=()=>$('modal').innerHTML='';
function printHTML(h){$('print-area').innerHTML=h;window.print()}
const cabSel=()=>isA()?`<select onchange="PG=1;F.cab=this.value;render()" class="${IN} sm:w-48"><option value="">Semua Cabang</option>${S.cabang.map(c=>`<option value="${c.id}" ${F.cab===c.id?'selected':''}>${esc(c.nama)}</option>`).join('')}</select>`:'';
function monthOpts(sel){let h='';const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);for(let i=0;i<14;i++){const k=mk(d);h+=`<option value="${k}" ${k===sel?'selected':''}>${bl(k)}</option>`;d.setMonth(d.getMonth()-1)}return h}

/* ===== Lapisan Data (Firestore / Preview memori) ===== */
async function initBackend(){
  if(IS_PREVIEW)return;
  const b='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,Fs,Au]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-firestore.js'),import(b+'firebase-auth.js')]);
  const app=A.initializeApp(firebaseConfig);
  FB={...Fs,...Au,db:Fs.getFirestore(app),auth:Au.getAuth(app)};
}
const DB={
  async all(c){const s=await FB.getDocs(FB.collection(FB.db,c));return s.docs.map(d=>({...d.data(),id:d.id}))},
  async mine(c){const s=await FB.getDocs(FB.query(FB.collection(FB.db,c),FB.where('diinputOleh.uid','==',me.uid)));return s.docs.map(d=>({...d.data(),id:d.id}))},
  async put(c,o){const{id,...d}=o;if(!IS_PREVIEW)await FB.setDoc(FB.doc(FB.db,c,id),d);const i=S[c].findIndex(x=>x.id===id);i<0?S[c].push(o):S[c][i]=o},
  async del(c,id){if(!IS_PREVIEW)await FB.deleteDoc(FB.doc(FB.db,c,id));S[c]=S[c].filter(x=>x.id!==id)},
  async load(){
    if(IS_PREVIEW)return;
    S.cabang=await DB.all('cabang');S.settings=await DB.all('settings');
    if(isA()){for(const c of['users','pelanggan','tagihan'])S[c]=await DB.all(c)}
    else{S.users=[];S.pelanggan=await DB.mine('pelanggan');S.tagihan=await DB.mine('tagihan')}
  }
};

/* ===== Setup database otomatis ===== */
async function autoSetupDatabase(){
  const cek=IS_PREVIEW?S.cabang:await DB.all('cabang');
  if(cek.length)return;
  const adm={uid:me?me.uid:'ADMIN-1',nama:me?me.nama:'Administrator',role:'Admin',cabangId:''};
  const h=await sha('petugas123');
  const cab=[{id:'CBG-001',nama:'Cabang Pusat',kode:'PST',alamat:'Jl. Merdeka No. 1'},{id:'CBG-002',nama:'Cabang Timur',kode:'TMR',alamat:'Jl. Timur Raya No. 8'}];
  const usr=[{id:'USR-001',nama:'Budi Petugas',username:'petugas1',passwordHash:h,role:'Petugas',cabangId:'CBG-001',aktif:true},{id:'USR-002',nama:'Sari Petugas',username:'petugas2',passwordHash:h,role:'Petugas',cabangId:'CBG-002',aktif:true}];
  const o1={uid:'USR-001',nama:'Budi Petugas',role:'Petugas',cabangId:'CBG-001'},o2={uid:'USR-002',nama:'Sari Petugas',role:'Petugas',cabangId:'CBG-002'};
  const now=new Date().toISOString();
  const plg=[
    {id:'PLG-0001',nama:'Budi Santoso',alamat:'Jl. Melati 12',paket:'Home 20 Mbps',tarif:150000,cabangId:'CBG-001',aktif:true,diinputOleh:o1,createdAt:now},
    {id:'PLG-0002',nama:'Siti Aminah',alamat:'Jl. Mawar 5',paket:'Home 10 Mbps',tarif:100000,cabangId:'CBG-001',aktif:true,diinputOleh:o1,createdAt:now},
    {id:'PLG-0003',nama:'Agus Pratama',alamat:'Jl. Timur 21',paket:'Home 30 Mbps',tarif:200000,cabangId:'CBG-002',aktif:true,diinputOleh:o2,createdAt:now},
    {id:'PLG-0004',nama:'Dewi Lestari',alamat:'Jl. Kenanga 3',paket:'Home 20 Mbps',tarif:150000,cabangId:'CBG-001',aktif:true,diinputOleh:adm,createdAt:now}];
  const tg=[{id:'PLG-0001_'+mk(new Date()),pelangganId:'PLG-0001',nama:'Budi Santoso',alamat:'Jl. Melati 12',cabangId:'CBG-001',bulan:mk(new Date()),nominalBayar:150000,status:'Lunas',tglBayar:now,diinputOleh:o1,dibayarOleh:o1,catatan:''}];
  for(const x of cab)await DB.put('cabang',x);
  for(const x of usr)await DB.put('users',x);
  for(const x of plg)await DB.put('pelanggan',x);
  for(const x of tg)await DB.put('tagihan',x);
  await DB.put('settings',{id:'app',namaAplikasi:'BUKU KAS'});
}

/* ===== Auth ===== */
async function doLogin(e){
  e.preventDefault();const u=$('lu').value.trim(),p=$('lp').value;$('le').classList.add('hidden');
  try{
    if(u.includes('@')){
      if(IS_PREVIEW){if(u==='admin@bukukas.com'&&p==='admin123')me={uid:'ADMIN-1',nama:'Administrator',role:'Admin',cabangId:''};else throw 0}
      else{const r=await FB.signInWithEmailAndPassword(FB.auth,u,p);me={uid:r.user.uid,nama:r.user.displayName||u.split('@')[0],role:'Admin',cabangId:''}}
    }else{
      let list=S.users;
      if(!IS_PREVIEW){const s=await FB.getDocs(FB.query(FB.collection(FB.db,'users'),FB.where('username','==',u)));list=s.docs.map(d=>({...d.data(),id:d.id}))}
      const h=await sha(p),x=list.find(z=>z.username===u&&z.passwordHash===h&&z.aktif!==false);
      if(!x)throw 0;me={uid:x.id,nama:x.nama,role:'Petugas',cabangId:x.cabangId};
    }
  }catch(err){$('le').classList.remove('hidden');return}
  try{
    if(!IS_PREVIEW&&isA())await autoSetupDatabase();
    await DB.load();
  }catch(err){toast('Gagal memuat data: '+(err.code||err.message),'e')}
  startApp();
}
function startApp(){
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('u-nama').textContent=me.nama;$('u-info').textContent=me.role+(me.cabangId?' • '+cabNama(me.cabangId):' • Semua Cabang');
  $('sub').textContent=me.nama+' ('+me.role+')'+(me.cabangId?' • '+cabNama(me.cabangId):'');
  applyBrand();buildNav();go('dashboard');
}
function applyBrand(){$('brand').textContent=brand();$('brand-login').textContent=brand()}
function logout(){if(!IS_PREVIEW&&FB&&isA())FB.signOut(FB.auth);me=null;F.cab='';$('lp').value='';$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function refresh(){$('ri').classList.add('fa-spin');try{await DB.load();render();toast('Data diperbarui')}catch(e){toast('Gagal memuat data','e')}$('ri').classList.remove('fa-spin')}

/* ===== Navigasi ===== */
const MENU=[['dashboard','Dashboard','fa-gauge'],['pelanggan','Pelanggan','fa-users'],['bayar','Bayar','fa-money-bill-wave'],['laporan','Laporan','fa-file-lines'],['cabang','Cabang','fa-building',1],['user','User','fa-user-gear',1],['setting','Atur','fa-gear',1]];
const TITLES={dashboard:'Dashboard',pelanggan:'Data Pelanggan',bayar:'Input Pembayaran',laporan:'Laporan',cabang:'Manajemen Cabang',user:'Manajemen User Petugas',setting:'Pengaturan'};
function buildNav(){
  const m=MENU.filter(x=>!x[3]||isA());
  $('nav-side').innerHTML=m.map(x=>`<button onclick="go('${x[0]}')" data-t="${x[0]}" class="nv w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm text-slate-600 hover:bg-slate-100 transition"><i class="fa-solid ${x[2]} w-5"></i>${x[1]==='Atur'?'Pengaturan':x[1]==='Bayar'?'Pembayaran':x[1]}</button>`).join('');
  $('nav-bot').innerHTML=m.map(x=>`<button onclick="go('${x[0]}')" data-t="${x[0]}" class="nv flex-1 flex flex-col items-center py-1.5 rounded-xl text-[9px] font-semibold text-slate-500"><i class="fa-solid ${x[2]} text-base mb-0.5"></i>${x[1]}</button>`).join('');
}
function go(t){tab=t;F.q='';PG=1;document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('act',b.dataset.t===t));render()}
const VIEWS={dashboard:vDash,pelanggan:vPlg,bayar:vByr,laporan:vLap,cabang:vCab,user:vUsr,setting:vSet};
function render(){
  $('ttl').textContent=TITLES[tab];$('main').innerHTML=VIEWS[tab]();
  const f={dashboard:drawCharts,pelanggan:tPlg,bayar:tByr,laporan:tLap,cabang:tCab,user:tUsr}[tab];if(f)f();
}
const card=(l,v,i,c)=>`<div class="glass rounded-2xl p-4 flex items-center gap-3"><div class="w-11 h-11 rounded-xl ${c} flex items-center justify-center text-white"><i class="fa-solid ${i}"></i></div><div><div class="text-[11px] text-slate-500 font-semibold">${l}</div><div class="text-lg font-extrabold">${v}</div></div></div>`;

/* ===== Dashboard ===== */
function vDash(){
  const k=mk(new Date()),P=visP().filter(p=>p.aktif!==false),T=visT(),Tb=T.filter(t=>t.bulan===k);
  const ids=new Set(Tb.map(t=>t.pelangganId)),belum=P.filter(p=>!ids.has(p.id)).length,tot=Tb.reduce((a,t)=>a+t.nominalBayar,0);
  const y=new Date().getFullYear();CH.m=Array(12).fill(0);T.filter(t=>t.bulan.startsWith(y+'-')).forEach(t=>CH.m[+t.bulan.slice(5)-1]+=t.nominalBayar);
  CH.l=ids.size;CH.b=belum;
  return `<div class="flex flex-wrap gap-2 mb-4 items-center"><span class="text-xs font-semibold text-slate-500">Periode: ${bl(k)}</span>${cabSel()}</div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${card('Pelanggan Aktif',P.length,'fa-users','bg-blue-600')}${card('Sudah Bayar',ids.size,'fa-circle-check','bg-emerald-500')}${card('Belum Bayar',belum,'fa-clock','bg-orange-500')}${card('Pemasukan Bulan Ini',rp(tot),'fa-wallet','bg-violet-600')}</div>
  <div class="grid lg:grid-cols-3 gap-3"><div class="glass rounded-2xl p-4 lg:col-span-2"><div class="text-xs font-bold mb-2">Pemasukan per Bulan ${y}</div><div class="h-64"><canvas id="c1"></canvas></div></div><div class="glass rounded-2xl p-4"><div class="text-xs font-bold mb-2">Status Bulan Ini</div><div class="h-64"><canvas id="c2"></canvas></div></div></div>`;
}
function drawCharts(){
  charts.forEach(c=>c.destroy());charts=[];if(!window.Chart)return;
  charts.push(new Chart($('c1'),{type:'bar',data:{labels:['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],datasets:[{data:CH.m,backgroundColor:'#2563eb',borderRadius:6}]},options:{plugins:{legend:{display:false}},maintainAspectRatio:false}}));
  charts.push(new Chart($('c2'),{type:'doughnut',data:{labels:['Lunas','Belum'],datasets:[{data:[CH.l,CH.b],backgroundColor:['#10b981','#f97316']}]},options:{maintainAspectRatio:false}}));
}

/* ===== Data Pelanggan (input sekali) ===== */
function vPlg(){return `<div class="flex flex-wrap gap-2 mb-4 items-center"><input oninput="PG=1;F.q=this.value;tPlg()" value="${esc(F.q)}" placeholder="Cari nama / ID..." class="${IN} sm:w-64">${cabSel()}<button onclick="fPlg()" class="${BT} ml-auto"><i class="fa-solid fa-plus mr-1"></i>Pelanggan</button></div><div id="tbl" class="glass rounded-2xl overflow-x-auto"></div>`}
function tPlg(){
  const q=F.q.toLowerCase(),r=visP().filter(p=>(p.nama+p.id).toLowerCase().includes(q));
  $('tbl').innerHTML=table(['ID','Pelanggan','Cabang','Paket / Tarif','Diinput Oleh','Status',''],r.map(p=>[
    `<span class="font-mono font-bold text-blue-700">${p.id}</span>`,`<b>${esc(p.nama)}</b><div class="text-slate-500">${esc(p.alamat)}</div>${p.keterangan?`<div class="text-[10px] italic text-slate-400">${esc(p.keterangan)}</div>`:''}`,esc(cabNama(p.cabangId)),`${esc(p.paket)}<div class="font-bold">${rp(p.tarif)}</div>`,
    `${esc(p.diinputOleh?.nama)}<div class="text-[10px] text-slate-400">${esc(p.diinputOleh?.role)}</div>`,
    `<span class="px-2 py-0.5 rounded text-[10px] font-bold ${p.aktif!==false?'bg-emerald-100 text-emerald-700':'bg-slate-200 text-slate-600'}">${p.aktif!==false?'Aktif':'Nonaktif'}</span>`,
    `<div class="whitespace-nowrap"><button onclick="fPlg('${p.id}')" class="text-blue-600 font-bold mr-2">Edit</button><button onclick="tglPlg('${p.id}')" class="text-orange-600 font-bold mr-2">${p.aktif!==false?'Nonaktifkan':'Aktifkan'}</button>${isA()?`<button onclick="delPlg('${p.id}')" class="text-red-600 font-bold">Hapus</button>`:''}</div>`]));
}
function fPlg(id){
  const p=S.pelanggan.find(x=>x.id===id)||{};
  modal(id?'Edit Pelanggan':'Tambah Pelanggan',`<form onsubmit="sPlg(event)" class="space-y-3"><input type="hidden" id="f-old" value="${id||''}">
  ${fld('ID Pelanggan',`<input id="f-id" readonly class="${IN} bg-slate-100 font-mono" value="${p.id||'PLG-'+uid6()}">`)}
  ${fld('Nama',`<input id="f-nama" required class="${IN}" value="${esc(p.nama)}">`)}
  ${fld('Alamat',`<input id="f-alamat" required class="${IN}" value="${esc(p.alamat)}">`)}
  ${fld('Cabang',isA()?`<select id="f-cab" required class="${IN}"><option value="">- Pilih -</option>${S.cabang.map(c=>`<option value="${c.id}" ${p.cabangId===c.id?'selected':''}>${esc(c.nama)}</option>`).join('')}</select>`:`<input readonly class="${IN} bg-slate-100" value="${esc(cabNama(me.cabangId))}">`)}
  <div class="grid grid-cols-2 gap-3">${fld('Paket',`<input id="f-paket" required class="${IN}" value="${esc(p.paket)}">`)}${fld('Tarif Bulanan',`<input id="f-tarif" type="number" min="0" required class="${IN}" value="${p.tarif??''}">`)}</div>
  ${fld('Status',`<select id="f-aktif" class="${IN}"><option value="1">Aktif</option><option value="0" ${p.aktif===false?'selected':''}>Nonaktif</option></select>`)}
  ${fld('Keterangan',`<textarea id="f-ket" rows="2" placeholder="Contoh: Pelanggan lama, bayar tiap tanggal 5" class="${IN}">${esc(p.keterangan)}</textarea>`)}
  <button class="${BT} w-full py-2.5">Simpan</button></form>`);
}
async function sPlg(e){
  e.preventDefault();const old=S.pelanggan.find(x=>x.id===$('f-old').value);
  const o={id:$('f-id').value,nama:$('f-nama').value.trim(),alamat:$('f-alamat').value.trim(),paket:$('f-paket').value.trim(),tarif:Number($('f-tarif').value)||0,cabangId:isA()?$('f-cab').value:me.cabangId,aktif:$('f-aktif').value==='1',keterangan:$('f-ket').value.trim(),diinputOleh:old?old.diinputOleh:who(),createdAt:old?old.createdAt:new Date().toISOString()};
  if(await safe(()=>DB.put('pelanggan',o))){closeModal();toast('Pelanggan tersimpan');render()}
}
async function tglPlg(id){const p=S.pelanggan.find(x=>x.id===id);if(await safe(()=>DB.put('pelanggan',{...p,aktif:p.aktif===false})))tPlg()}
async function delPlg(id){
  if(!confirm('Hapus pelanggan beserta seluruh riwayat pembayarannya?'))return;
  if(await safe(async()=>{for(const t of S.tagihan.filter(t=>t.pelangganId===id))await DB.del('tagihan',t.id);await DB.del('pelanggan',id)})){toast('Pelanggan dihapus');tPlg()}
}

/* ===== Input Pembayaran (tinggal isi nominal) ===== */
function vByr(){return `<div class="flex flex-wrap gap-2 mb-3 items-center"><select onchange="PG=1;F.bln=this.value;tByr()" class="${IN} sm:w-52">${monthOpts(F.bln)}</select><input oninput="PG=1;F.q=this.value;tByr()" value="${esc(F.q)}" placeholder="Cari nama / ID..." class="${IN} sm:w-56">${cabSel()}<button onclick="fBayar()" class="${BT} ml-auto"><i class="fa-solid fa-plus mr-1"></i>Tambah Pembayaran</button></div><div id="sum" class="text-xs font-semibold text-slate-600 mb-2"></div><div id="tbl" class="glass rounded-2xl overflow-x-auto"></div>`}
function tByr(){
  const q=F.q.toLowerCase(),T=Object.fromEntries(S.tagihan.filter(t=>t.bulan===F.bln).map(t=>[t.pelangganId,t]));
  const P=visP().filter(p=>p.aktif!==false&&(p.nama+p.id).toLowerCase().includes(q));
  const lunas=P.filter(p=>T[p.id]).length;
  $('sum').innerHTML=`${bl(F.bln)}: <span class="text-emerald-600">${lunas} lunas</span> • <span class="text-orange-600">${P.length-lunas} belum</span>`;
  $('tbl').innerHTML=table(['Pelanggan','Cabang','Tarif','Nominal Bayar','Status','Diinput / Dicatat Oleh',''],P.map(p=>{const t=T[p.id];return[
    `<b>${esc(p.nama)}</b><div class="font-mono text-[10px] text-slate-500">${p.id}</div>`,esc(cabNama(p.cabangId)),rp(p.tarif),
    t?`<b>${rp(t.nominalBayar)}</b>`:`<input id="n-${p.id}" type="number" min="1" value="${p.tarif}" class="w-28 py-1.5 px-2 border border-slate-200 rounded-lg text-xs">`,
    `<span class="px-2 py-0.5 rounded text-[10px] font-bold ${t?'bg-emerald-100 text-emerald-700':'bg-orange-100 text-orange-700'}">${t?'Lunas':'Belum Bayar'}</span>`,
    `${esc(p.diinputOleh?.nama)}<div class="text-[10px] text-slate-400">${t?'Dicatat: '+esc(t.dibayarOleh?.nama):'-'}</div>${t&&t.catatan?`<div class="text-[10px] italic text-slate-500">Ket: ${esc(t.catatan)}</div>`:''}`,
    t?`<div class="whitespace-nowrap"><button onclick="kw('${t.id}')" class="text-blue-600 font-bold mr-2">Kwitansi</button><button onclick="batal('${t.id}')" class="text-red-600 font-bold">Batalkan</button></div>`:`<button onclick="bayar('${p.id}')" class="${BT}">Bayar</button>`]}));
}
const mkTg=(p,bln,n,ket)=>({id:p.id+'_'+bln,pelangganId:p.id,nama:p.nama,alamat:p.alamat,cabangId:p.cabangId,bulan:bln,nominalBayar:n,status:'Lunas',tglBayar:new Date().toISOString(),diinputOleh:p.diinputOleh,dibayarOleh:who(),catatan:ket||''});
function fBayar(){
  const P=visP().filter(p=>p.aktif!==false),rd=(v,l,c)=>`<label class="flex items-center gap-2 p-2.5 border border-slate-200 rounded-xl cursor-pointer text-xs font-bold"><input type="radio" name="md" value="${v}" ${c?'checked':''} onchange="mdB()">${l}</label>`;
  modal('Tambah Pembayaran',`<form onsubmit="sBayar(event)" class="space-y-3">
  <div class="grid grid-cols-2 gap-2">${rd('lama','Pelanggan Lama',1)}${rd('baru','Pelanggan Baru',0)}</div>
  ${fld('Bulan Tagihan',`<select id="b-bln" class="${IN}">${monthOpts(F.bln)}</select>`)}
  <div id="b-lama">${fld('Pilih Pelanggan',`<select id="b-plg" onchange="pilPlg()" class="${IN}"><option value="">- Pilih pelanggan -</option>${P.map(p=>`<option value="${p.id}" data-t="${p.tarif}">${esc(p.nama)} (${p.id}) - ${esc(cabNama(p.cabangId))}</option>`).join('')}</select>`)}</div>
  <div id="b-baru" class="hidden space-y-3">
    ${fld('Nama Pelanggan',`<input id="b-nama" class="${IN}">`)}${fld('Alamat',`<input id="b-alamat" class="${IN}">`)}
    ${fld('Cabang',isA()?`<select id="b-cab" class="${IN}"><option value="">- Pilih -</option>${S.cabang.map(c=>`<option value="${c.id}">${esc(c.nama)}</option>`).join('')}</select>`:`<input readonly class="${IN} bg-slate-100" value="${esc(cabNama(me.cabangId))}">`)}
    <div class="grid grid-cols-2 gap-3">${fld('Paket',`<input id="b-paket" class="${IN}">`)}${fld('Tarif Bulanan',`<input id="b-tarif" type="number" min="0" oninput="$('b-nom').value=this.value" class="${IN}">`)}</div>
    ${fld('Keterangan Pelanggan',`<input id="b-pket" placeholder="Opsional" class="${IN}">`)}
  </div>
  ${fld('Nominal Bayar',`<input id="b-nom" type="number" min="1" required class="${IN}">`)}
  ${fld('Keterangan Pembayaran',`<textarea id="b-ket" rows="2" placeholder="Contoh: Dibayar tunai / transfer, titip tetangga" class="${IN}"></textarea>`)}
  <button class="${BT} w-full py-2.5">Simpan Pembayaran</button></form>`);
}
function mdB(){const b=document.querySelector('input[name=md]:checked').value==='baru';$('b-lama').classList.toggle('hidden',b);$('b-baru').classList.toggle('hidden',!b)}
function pilPlg(){const o=$('b-plg').selectedOptions[0];$('b-nom').value=o&&o.dataset.t?o.dataset.t:''}
async function sBayar(e){
  e.preventDefault();
  const baru=document.querySelector('input[name=md]:checked').value==='baru',bln=$('b-bln').value,n=Number($('b-nom').value);
  if(!(n>0))return toast('Nominal harus lebih dari 0','e');
  let p;
  if(baru){
    const nama=$('b-nama').value.trim(),alamat=$('b-alamat').value.trim(),cab=isA()?$('b-cab').value:me.cabangId;
    if(!nama||!alamat||!cab)return toast('Lengkapi nama, alamat, dan cabang','e');
    p={id:'PLG-'+uid6(),nama,alamat,paket:$('b-paket').value.trim()||'-',tarif:Number($('b-tarif').value)||n,cabangId:cab,aktif:true,keterangan:$('b-pket').value.trim(),diinputOleh:who(),createdAt:new Date().toISOString()};
  }else{
    p=S.pelanggan.find(x=>x.id===$('b-plg').value);
    if(!p)return toast('Pilih pelanggan terlebih dahulu','e');
    if(S.tagihan.some(t=>t.id===p.id+'_'+bln))return toast('Pelanggan ini sudah lunas di bulan tersebut','e');
  }
  if(await safe(async()=>{if(baru)await DB.put('pelanggan',p);await DB.put('tagihan',mkTg(p,bln,n,$('b-ket').value.trim()))})){F.bln=bln;closeModal();toast(baru?'Pelanggan baru & pembayaran tersimpan':'Pembayaran tersimpan');render()}
}
async function bayar(pid){
  const p=S.pelanggan.find(x=>x.id===pid),n=Number($('n-'+pid).value);
  if(!(n>0))return toast('Nominal harus lebih dari 0','e');
  const o=mkTg(p,F.bln,n);
  if(await safe(()=>DB.put('tagihan',o))){toast('Pembayaran '+p.nama+' tercatat');tByr()}
}
async function batal(id){if(confirm('Batalkan pembayaran ini?')&&await safe(()=>DB.del('tagihan',id))){toast('Pembayaran dibatalkan');tByr()}}
function rcHTML(t){
  const r=(a,b)=>`<tr><td style="padding:3px 0;color:#64748b">${a}</td><td style="text-align:right;font-weight:600">${b}</td></tr>`;
  return `<div style="font-family:sans-serif;max-width:420px;margin:auto;border:2px solid #1e293b;padding:16px"><h2 style="text-align:center;margin:0">${esc(brand())}</h2><p style="text-align:center;font-size:12px;margin:2px 0 8px">KWITANSI PEMBAYARAN INTERNET</p><hr><table style="width:100%;font-size:13px">${r('ID Pelanggan',t.pelangganId)}${r('Nama',esc(t.nama))}${r('Alamat',esc(t.alamat))}${r('Cabang',esc(cabNama(t.cabangId)))}${r('Periode',bl(t.bulan))}${r('Tgl Bayar',new Date(t.tglBayar).toLocaleDateString('id-ID'))}${r('Diinput Oleh',esc(t.diinputOleh?.nama))}${r('Dicatat Oleh',esc(t.dibayarOleh?.nama))}${t.catatan?r('Keterangan',esc(t.catatan)):''}</table><hr><div style="display:flex;justify-content:space-between;font-size:16px;font-weight:800"><span>TOTAL</span><span>${rp(t.nominalBayar)}</span></div><p style="text-align:center;font-size:12px;margin-top:10px">LUNAS - Terima kasih</p></div>`;
}
function kw(id){const t=S.tagihan.find(x=>x.id===id);modal('Kwitansi',`<div id="rc">${rcHTML(t)}</div><button onclick="printHTML($('rc').innerHTML)" class="${BT} w-full py-2.5 mt-3"><i class="fa-solid fa-print mr-1"></i>Cetak</button>`)}

/* ===== Laporan ===== */
function repRows(){
  const T=Object.fromEntries(S.tagihan.filter(t=>t.bulan===F.bln).map(t=>[t.pelangganId,t]));
  return visP().filter(p=>p.aktif!==false||T[p.id]).map(p=>{const t=T[p.id];return{'ID':p.id,'Nama':p.nama,'Cabang':cabNama(p.cabangId),'Status':t?'Lunas':'Belum Bayar','Nominal':t?t.nominalBayar:0,'Tgl Bayar':t?new Date(t.tglBayar).toLocaleDateString('id-ID'):'-','Diinput Oleh':p.diinputOleh?.nama||'-','Dicatat Oleh':t?.dibayarOleh?.nama||'-','Keterangan':(t&&t.catatan)||p.keterangan||''}});
}
function vLap(){return `<div class="flex flex-wrap gap-2 mb-3 items-center"><select onchange="PG=1;F.bln=this.value;tLap()" class="${IN} sm:w-52">${monthOpts(F.bln)}</select>${cabSel()}<div class="ml-auto flex gap-2"><button onclick="xls()" class="${BT} !bg-emerald-600"><i class="fa-solid fa-file-excel mr-1"></i>Excel</button><button onclick="cetakLap()" class="${BT} !bg-slate-700"><i class="fa-solid fa-print mr-1"></i>Cetak</button></div></div><div id="sum" class="grid grid-cols-3 gap-3 mb-3"></div><div id="tbl" class="glass rounded-2xl overflow-x-auto"></div>`}
function lapTable(r,all){return table(['ID','Nama','Cabang','Status','Nominal','Tgl Bayar','Diinput Oleh','Dicatat Oleh','Keterangan'],r.map(x=>[x.ID,esc(x.Nama),esc(x.Cabang),`<b class="${x.Status==='Lunas'?'text-emerald-600':'text-orange-600'}">${x.Status}</b>`,rp(x.Nominal),x['Tgl Bayar'],esc(x['Diinput Oleh']),esc(x['Dicatat Oleh']),esc(x.Keterangan)]),all)}
function tLap(){
  const r=repRows(),tot=r.reduce((a,x)=>a+x.Nominal,0),l=r.filter(x=>x.Status==='Lunas').length;
  $('sum').innerHTML=card('Pelanggan',r.length,'fa-users','bg-blue-600')+card('Lunas / Belum',l+' / '+(r.length-l),'fa-list-check','bg-orange-500')+card('Total Masuk',rp(tot),'fa-wallet','bg-emerald-500');
  $('tbl').innerHTML=lapTable(r);
}
function xls(){const r=repRows();if(!r.length)return toast('Tidak ada data','e');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),'Laporan');XLSX.writeFile(wb,'Laporan_Tagihan_'+F.bln+'.xlsx');toast('Excel diunduh')}
function cetakLap(){const r=repRows(),tot=r.reduce((a,x)=>a+x.Nominal,0);printHTML(`<div style="font-family:sans-serif;font-size:11px"><h2 style="margin:0">${esc(brand())} - Laporan ${bl(F.bln)}</h2><p>Cabang: ${F.cab?esc(cabNama(F.cab)):'Semua'} • Dicetak oleh ${esc(me.nama)} • ${new Date().toLocaleString('id-ID')}</p>${lapTable(r,1).replace(/<table/,'<table border="1" style="border-collapse:collapse;width:100%"')}<h3>Total Pemasukan: ${rp(tot)}</h3></div>`)}

/* ===== Manajemen Cabang (Admin) ===== */
function vCab(){return `<div class="flex mb-4"><button onclick="fCab()" class="${BT} ml-auto"><i class="fa-solid fa-plus mr-1"></i>Cabang</button></div><div id="tbl" class="glass rounded-2xl overflow-x-auto"></div>`}
function tCab(){$('tbl').innerHTML=table(['ID','Kode','Nama Cabang','Alamat','Pelanggan','Petugas',''],S.cabang.map(c=>[`<span class="font-mono font-bold">${c.id}</span>`,esc(c.kode),`<b>${esc(c.nama)}</b>`,esc(c.alamat),S.pelanggan.filter(p=>p.cabangId===c.id).length,S.users.filter(u=>u.cabangId===c.id).length,`<button onclick="fCab('${c.id}')" class="text-blue-600 font-bold mr-2">Edit</button><button onclick="delCab('${c.id}')" class="text-red-600 font-bold">Hapus</button>`]))}
function fCab(id){const c=S.cabang.find(x=>x.id===id)||{};modal(id?'Edit Cabang':'Tambah Cabang',`<form onsubmit="sCab(event)" class="space-y-3"><input type="hidden" id="f-old" value="${id||''}">${fld('Nama Cabang',`<input id="f-nama" required class="${IN}" value="${esc(c.nama)}">`)}${fld('Kode',`<input id="f-kode" required maxlength="6" class="${IN}" value="${esc(c.kode)}">`)}${fld('Alamat',`<input id="f-alamat" class="${IN}" value="${esc(c.alamat)}">`)}<button class="${BT} w-full py-2.5">Simpan</button></form>`)}
async function sCab(e){
  e.preventDefault();const old=$('f-old').value,n=Math.max(0,...S.cabang.map(c=>+c.id.split('-')[1]||0))+1;
  const o={id:old||'CBG-'+String(n).padStart(3,'0'),nama:$('f-nama').value.trim(),kode:$('f-kode').value.trim().toUpperCase(),alamat:$('f-alamat').value.trim()};
  if(await safe(()=>DB.put('cabang',o))){closeModal();toast('Cabang tersimpan');tCab()}
}
async function delCab(id){
  if(S.pelanggan.some(p=>p.cabangId===id)||S.users.some(u=>u.cabangId===id))return toast('Cabang masih dipakai pelanggan/petugas','e');
  if(confirm('Hapus cabang ini?')&&await safe(()=>DB.del('cabang',id))){toast('Cabang dihapus');tCab()}
}

/* ===== Manajemen User Petugas (Admin) ===== */
function vUsr(){return `<div class="flex mb-4"><button onclick="fUsr()" class="${BT} ml-auto"><i class="fa-solid fa-plus mr-1"></i>Petugas</button></div><div id="tbl" class="glass rounded-2xl overflow-x-auto"></div>`}
function tUsr(){$('tbl').innerHTML=table(['ID','Nama','Username','Cabang','Status',''],S.users.map(u=>[`<span class="font-mono font-bold">${u.id}</span>`,`<b>${esc(u.nama)}</b>`,esc(u.username),esc(cabNama(u.cabangId)),`<span class="px-2 py-0.5 rounded text-[10px] font-bold ${u.aktif!==false?'bg-emerald-100 text-emerald-700':'bg-slate-200 text-slate-600'}">${u.aktif!==false?'Aktif':'Nonaktif'}</span>`,`<button onclick="fUsr('${u.id}')" class="text-blue-600 font-bold mr-2">Edit</button><button onclick="delUsr('${u.id}')" class="text-red-600 font-bold">Hapus</button>`]))}
function fUsr(id){
  const u=S.users.find(x=>x.id===id)||{};
  modal(id?'Edit Petugas':'Tambah Petugas',`<form onsubmit="sUsr(event)" class="space-y-3"><input type="hidden" id="f-old" value="${id||''}">${fld('Nama',`<input id="f-nama" required class="${IN}" value="${esc(u.nama)}">`)}${fld('Username',`<input id="f-user" required class="${IN}" value="${esc(u.username)}">`)}${fld('Password'+(id?' (kosongkan jika tidak diubah)':''),`<input id="f-pass" type="password" ${id?'':'required'} minlength="6" class="${IN}">`)}${fld('Cabang',`<select id="f-cab" required class="${IN}"><option value="">- Pilih -</option>${S.cabang.map(c=>`<option value="${c.id}" ${u.cabangId===c.id?'selected':''}>${esc(c.nama)}</option>`).join('')}</select>`)}${fld('Status',`<select id="f-aktif" class="${IN}"><option value="1">Aktif</option><option value="0" ${u.aktif===false?'selected':''}>Nonaktif</option></select>`)}<button class="${BT} w-full py-2.5">Simpan</button></form>`);
}
async function sUsr(e){
  e.preventDefault();const old=S.users.find(x=>x.id===$('f-old').value),un=$('f-user').value.trim();
  if(un.includes('@'))return toast('Username tidak boleh mengandung @','e');
  if(S.users.some(x=>x.username===un&&(!old||x.id!==old.id)))return toast('Username sudah dipakai','e');
  const p=$('f-pass').value,n=Math.max(0,...S.users.map(x=>+x.id.split('-')[1]||0))+1;
  const o={id:old?old.id:'USR-'+String(n).padStart(3,'0'),nama:$('f-nama').value.trim(),username:un,passwordHash:p?await sha(p):old.passwordHash,role:'Petugas',cabangId:$('f-cab').value,aktif:$('f-aktif').value==='1'};
  if(await safe(()=>DB.put('users',o))){closeModal();toast('Petugas tersimpan');tUsr()}
}
async function delUsr(id){if(confirm('Hapus petugas ini? Data yang pernah ia input tetap tersimpan.')&&await safe(()=>DB.del('users',id))){toast('Petugas dihapus');tUsr()}}

/* ===== Pengaturan (Admin) ===== */
function vSet(){return `<form onsubmit="sSet(event)" class="glass rounded-2xl p-5 max-w-md space-y-3">${fld('Nama Aplikasi',`<input id="f-app" required class="${IN}" value="${esc(brand())}">`)}<button class="${BT} py-2.5">Simpan</button><p class="text-[11px] text-slate-500">Mode: ${IS_PREVIEW?'Preview (data sementara di memori)':'Terhubung ke Firebase'}</p></form>`}
async function sSet(e){e.preventDefault();if(await safe(()=>DB.put('settings',{id:'app',namaAplikasi:$('f-app').value.trim()}))){applyBrand();toast('Pengaturan disimpan')}}

/* ===== Boot ===== */
(async()=>{
  try{await initBackend();if(IS_PREVIEW)await autoSetupDatabase()}
  catch(e){$('le').textContent='Gagal inisialisasi Firebase: '+(e.message||e);$('le').classList.remove('hidden')}
})();
</script>
</body>
</html>
